<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab: Docker Compose + KVM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #1f2937;
    }
    .card {
      width: min(560px, 92vw);
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }
    h1 { margin: 0 0 4px; font-size: 24px; }
    .subtitle { margin: 0 0 24px; color: #6b7280; font-size: 14px; }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid #e5e7eb;
    }
    .row:last-of-type { border-bottom: none; }
    .label { color: #6b7280; font-weight: 600; }
    .value { font-family: ui-monospace, Menlo, monospace; text-align: right; word-break: break-all; }
    .status { margin-top: 20px; padding: 10px 14px; border-radius: 8px; font-size: 14px; }
    .status.ok { background: #dcfce7; color: #166534; }
    .status.error { background: #fee2e2; color: #991b1b; }
    .status.loading { background: #e0e7ff; color: #3730a3; }
    pre {
      margin: 16px 0 0;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 8px;
      font-size: 13px;
      overflow-x: auto;
    }
    button {
      margin-top: 16px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #2a5298;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #1e3c72; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Docker Compose + KVM</h1>
    <p class="subtitle">frontend (nginx) &rarr; /api/info &rarr; backend (Flask)</p>

    <div class="row"><span class="label">Сообщение</span><span class="value" id="message">—</span></div>
    <div class="row"><span class="label">Контейнер</span><span class="value" id="container">—</span></div>
    <div class="row"><span class="label">Время</span><span class="value" id="time">—</span></div>

    <div class="status loading" id="status">Загрузка данных от бэкенда…</div>
    <pre id="raw" hidden></pre>
    <button id="refresh">Обновить</button>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const rawEl = document.getElementById('raw');

    async function load() {
      statusEl.className = 'status loading';
      statusEl.textContent = 'Загрузка данных от бэкенда…';
      try {
        const response = await fetch('/api/info');
        if (!response.ok) {
          throw new Error(`HTTP ${response.status} ${response.statusText}`);
        }
        const data = await response.json();
        document.getElementById('message').textContent = data.message;
        document.getElementById('container').textContent = data.container;
        document.getElementById('time').textContent = new Date(data.time).toLocaleString('ru-RU');
        rawEl.textContent = JSON.stringify(data, null, 2);
        rawEl.hidden = false;
        statusEl.className = 'status ok';
        statusEl.textContent = 'Бэкенд доступен, данные получены.';
      } catch (err) {
        rawEl.hidden = true;
        statusEl.className = 'status error';
        statusEl.textContent = `Ошибка при запросе /api/info: ${err.message}`;
      }
    }

    document.getElementById('refresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
